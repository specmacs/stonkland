name: CI

# Runs on every push and pull request. The parameter check is the one worth calling out:
# it compares the figures the interface publishes against the constants in the Solidity
# and fails when they drift, which is the class of bug nobody catches by reading.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1

      - name: Build
        working-directory: contracts
        run: forge build --sizes

      - name: Test
        working-directory: contracts
        # Fork tests need a live RPC and are run deliberately, not on every push.
        run: forge test --no-match-path "test/fork/*" -vv

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Parameters match the contracts
        working-directory: web
        run: npm run check:parameters

      - name: Typecheck
        working-directory: web
        run: npm run typecheck

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Build
        working-directory: web
        run: npm run build
