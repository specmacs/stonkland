[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 1_000_000
via_ir = false
bytecode_hash = "none"
cbor_metadata = false
ffi = false
fs_permissions = [
    { access = "read", path = "./out" },
    { access = "read-write", path = "./deployments" },
]

# Accounting is the risk surface; warnings are reviewed, not suppressed.

[profile.default.fuzz]
runs = 512
max_test_rejects = 200_000

[profile.default.invariant]
runs = 256
depth = 64
fail_on_revert = false
call_override = false
shrink_run_limit = 5_000

[profile.deep.fuzz]
runs = 10_000

[profile.deep.invariant]
runs = 1_024
depth = 256

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = false
int_types = "long"

[rpc_endpoints]
mainnet = "${MAINNET_RPC_URL}"
base = "${BASE_RPC_URL}"
